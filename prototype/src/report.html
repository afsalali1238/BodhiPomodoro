<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Bodhi — Daily work report</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px 20px; background: #1b1a17; color: #eee3cc; font: 13px "Segoe UI", system-ui, sans-serif; }
  header { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; } h1 { font-size: 16px; color: #ffc24d; margin: 0; flex: 1; }
  select, button, textarea { background: #2c2a24; color: #eee3cc; border: 1px solid #4a453a; border-radius: 6px; padding: 5px 8px; font: inherit; }
  button.primary { background: #f59a3c; border-color: #f59a3c; color: #1b1a17; font-weight: 700; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi { background: #26241f; border-radius: 10px; padding: 8px 10px; } .kpi b { display: block; font-size: 20px; color: #fff; }
  pre { white-space: pre-wrap; background: #151410; border-radius: 10px; padding: 12px; max-height: 360px; overflow: auto; font: 12px Consolas, monospace; }
  textarea { width: 100%; box-sizing: border-box; height: 70px; }
</style></head>
<body>
  <header><h1>Daily work report</h1><select id="date"></select><button id="copy">Copy</button><button id="waCopy">WhatsApp</button><button class="primary" id="save">Save .md</button></header>
  <div class="kpis">
    <div class="kpi"><b id="kFocus">0m</b>focused</div><div class="kpi"><b id="kSess">0</b>sessions</div>
    <div class="kpi"><b id="kDone">0</b>tasks done</div><div class="kpi"><b id="kDis">0</b>distractions</div>
  </div>
  <label>Notes / blockers</label>
  <textarea id="notes" placeholder="What went well, what's blocked, plan for tomorrow…"></textarea>
  <pre id="md"></pre>
  <!-- TODO(build): weekly view, export to email/WhatsApp share -->
<script src="report.js"></script>
<script src="reportView.js"></script>
</body></html>
