<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Bodhi — Tasks</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 14px 16px; background: #1b1a17; color: #eee3cc; font: 13px "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 8px; color: #ffc24d; }
  input { width: 100%; box-sizing: border-box; background: #2c2a24; color: #eee3cc; border: 1px solid #4a453a; border-radius: 8px; padding: 8px 10px; font: inherit; transition: border-color .15s ease, box-shadow .15s ease; }
  input:focus { outline: none; border-color: #f59a3c; box-shadow: 0 0 0 2px rgba(245, 154, 60, 0.18); }
  .hint { color: #a89c85; font-size: 11px; margin: 4px 0 10px; }
  ul { list-style: none; padding: 0; margin: 0; max-height: 330px; overflow: auto; }
  li { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 8px; border: 1px solid transparent; transition: background .15s ease, border-color .15s ease; }
  li:hover { background: #25231e; }
  li.sel { background: #3a2c1a; border-color: #f59a3c; }
  li .t { flex: 1; cursor: pointer; } li .n { color: #a89c85; font-size: 11px; }
  button { background: #2c2a24; color: #eee3cc; border: 1px solid #4a453a; border-radius: 8px; padding: 5px 10px; font: inherit; cursor: pointer; transition: border-color .15s ease, background .15s ease, box-shadow .15s ease, transform .05s ease; }
  button:hover { border-color: #f59a3c; background: #35322a; }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid rgba(245, 154, 60, 0.55); outline-offset: 1px; }
  button.primary { background: linear-gradient(180deg, #ffb054, #f2903a); border-color: #f59a3c; color: #1b1a17; font-weight: 700; box-shadow: 0 2px 10px rgba(245, 154, 60, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
  button.primary:hover { background: linear-gradient(180deg, #ffb054, #f2903a); filter: brightness(1.06); box-shadow: 0 3px 14px rgba(245, 154, 60, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
  .foot { display: flex; gap: 8px; margin-top: 12px; } .foot button { flex: 1; padding: 9px; }
  #pickBar { display: none; } body.pick #pickBar { display: flex; }
</style></head>
<body>
  <h1 id="title">Tasks</h1>
  <input id="add" placeholder="Add a task…  e.g. “Write supplier report 2p”">
  <div class="hint">Enter to add · “2p” = 2 sessions · click a task to select it</div>
  <ul id="list"></ul>
  <div class="foot" id="pickBar"><button class="primary" id="startSel">Start on selected</button><button id="justFocus">Just focus</button></div>
  <!-- TODO(build): drag-to-reorder, edit title inline, "completed today" section -->
<script src="tasks.js"></script>
</body></html>
