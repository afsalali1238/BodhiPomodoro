<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Bodhi Pomodoro — Settings</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 18px 20px; background: #1b1a17; color: #eee3cc; font: 13px "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 2px; color: #ffd54f; }
  .sub { color: #a89c85; margin-bottom: 14px; font-size: 12px; }
  .status { background: #26241f; border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  .status b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .btns button { margin-left: 4px; }
  fieldset { border: 1px solid #3a362e; border-radius: 10px; margin: 0 0 12px; padding: 8px 12px 10px; }
  legend { color: #a89c85; padding: 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; gap: 10px; }
  input[type=number] { width: 64px; }
  input, select, button, textarea { background: #2c2a24; color: #eee3cc; border: 1px solid #4a453a; border-radius: 8px; padding: 4px 8px; font: inherit; transition: border-color .15s ease, background .15s ease, box-shadow .15s ease; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #f59a3c; box-shadow: 0 0 0 2px rgba(245, 154, 60, 0.18); }
  select { max-width: 220px; }
  button { cursor: pointer; padding: 6px 12px; }
  button:hover { border-color: #f59a3c; background: #35322a; }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid rgba(245, 154, 60, 0.55); outline-offset: 1px; }
  button.primary { background: linear-gradient(180deg, #ffb054, #f2903a); border-color: #f59a3c; color: #1b1a17; font-weight: 700; box-shadow: 0 2px 10px rgba(245, 154, 60, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
  button.primary:hover { background: linear-gradient(180deg, #ffb054, #f2903a); filter: brightness(1.06); box-shadow: 0 3px 14px rgba(245, 154, 60, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
  .presets button { margin: 2px 4px 2px 0; }
  .foot { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Bodhi Pomodoro</h1>
  <div class="sub">He sits while you focus. He walks while you rest.</div>

  <div class="status"><div><div id="phase">Ready</div><b id="time">--:--</b></div>
    <div class="btns"><button data-a="start" id="startBtn">Start</button><button data-a="skip">Skip</button><button data-a="reset">Reset</button></div></div>

  <fieldset><legend>Timing (minutes)</legend>
    <div class="presets">
      <button data-p="25,5,15">25/5</button><button data-p="15,3,10">15/3</button>
      <button data-p="50,10,20">50/10</button><button data-p="90,20,30">90/20</button><button data-p="1,1,2">Test 1/1</button>
    </div>
    <div class="row"><label for="focusMin">Meditation (focus)</label><input id="focusMin" type="number" min="1" max="240" step="1"></div>
    <div class="row"><label for="breakMin">Short walk (break)</label><input id="breakMin" type="number" min="1" max="120" step="1"></div>
    <div class="row"><label for="longBreakMin">Long walk</label><input id="longBreakMin" type="number" min="1" max="180" step="1"></div>
    <div class="row"><label for="cyclesBeforeLong">Long walk every</label><input id="cyclesBeforeLong" type="number" min="1" max="12" step="1"></div>
  </fieldset>

  <fieldset><legend>Screen</legend>
    <div class="row"><label for="displayId">Show on</label><select id="displayId"></select></div>
    <div class="row"><label for="scale">Size</label>
      <select id="scale"><option value="auto">Auto (fits screen)</option><option value="0.4">40%</option><option value="0.5">50%</option><option value="0.6">60%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select></div>
    <div class="row"><label for="alwaysOnTop">Always on top</label><input id="alwaysOnTop" type="checkbox"></div>
  </fieldset>

  <fieldset><legend>Behaviour</legend>
    <div class="row"><label for="walkAcross">Walk across the screen on break</label><input id="walkAcross" type="checkbox"></div>
    <div class="row"><label for="autoStartBreak">Start break timer automatically</label><input id="autoStartBreak" type="checkbox"></div>
    <div class="row"><label for="autoStartFocus">Sit again automatically after break</label><input id="autoStartFocus" type="checkbox"></div>
    <div class="row"><label for="sound">Bell sound</label><input id="sound" type="checkbox"></div>
    <div class="row"><label for="autoStart">Start with Windows</label><input id="autoStart" type="checkbox"></div>
  </fieldset>

  <fieldset><legend>Focus apps (lasers fire outside these)</legend>
    <div class="row"><label>Process names (one per line, e.g. chrome, Code, winword)</label><textarea id="focusApps" rows="4"></textarea></div>
    <div class="row"><label></label><button id="pickApps" type="button" style="padding:4px 10px;font-size:12px">Pick from running apps…</button></div>
  </fieldset>

  <fieldset><legend>Lasers</legend>
    <div class="row"><label for="lasers">Enabled</label><input id="lasers" type="checkbox"></div>
    <div class="row"><label for="laserMax">Max tier</label><input id="laserMax" type="number" min="0" max="3" step="1"></div>
    <div class="row"><label for="graceSec">Grace (sec)</label><input id="graceSec" type="number" min="0" max="60" step="1"></div>
    <div class="row"><label for="cooldownSec">Cooldown (sec)</label><input id="cooldownSec" type="number" min="5" max="120" step="1"></div>
  </fieldset>

  <fieldset><legend>Focus protection</legend>
    <div class="row"><label for="awayPauseMin">Away pause (min)</label><input id="awayPauseMin" type="number" min="1" max="30" step="1"></div>
    <div class="row"><label for="hideInMeetings">Hide in meetings</label><input id="hideInMeetings" type="checkbox"></div>
    <div class="row"><label for="hideFullscreen">Hide in fullscreen</label><input id="hideFullscreen" type="checkbox"></div>
    <div class="row"><label for="askTaskOnStart">Ask for task on start</label><input id="askTaskOnStart" type="checkbox"></div>
  </fieldset>

  <fieldset><legend>Break & Report</legend>
    <div class="row"><label for="breakNudge">Break nudge</label><input id="breakNudge" type="checkbox"></div>
    <div class="row"><label for="reportTime">Report time</label><input id="reportTime" type="time" value="18:00"></div>
    <div class="row"><label for="reduceMotion">Reduce laser motion</label><input id="reduceMotion" type="checkbox"></div>
    <div class="row"><label>Distractions (one per line)</label><textarea id="distractList" rows="4"></textarea></div>
    <div class="row"><label>Allow list (one per line)</label><textarea id="allowList" rows="4"></textarea></div>
  </fieldset>
  <div class="foot"><button id="save" class="primary">Save</button></div>
<script src="settings.js"></script>
</body>
</html>
