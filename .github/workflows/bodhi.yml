name: Bodhi (Tauri rebuild)

on:
  push:
    branches: ['**']
    paths: ['bodhi/**', '.github/workflows/bodhi.yml']
  pull_request:
    branches: ['**']
    paths: ['bodhi/**', '.github/workflows/bodhi.yml']

jobs:
  frontend:
    name: Frontend (lint · types · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bodhi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: bodhi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bodhi/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bodhi/src-tauri

      - name: Check formatting
        run: cargo fmt --check

      # TEMP-DEBUG: sandbox can't download CI logs, so surface the fmt diff
      # as a check annotation (readable via API). REMOVE after M0 is green.
      - name: Report fmt diff
        if: failure() && matrix.os == 'ubuntu-latest'
        run: |
          DIFF=$(cargo fmt --diff 2>&1 | head -c 30000 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
          echo "::error title=Rustfmt diff::$DIFF"

      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      - name: Check compile
        run: cargo check
