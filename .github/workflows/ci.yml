name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # setup-node resolves '20' to the latest 20.x patch release, which is
          # well above the 20.11 minimum node:test's mock.timers object-form
          # API needs (used in tests/state.test.js).
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: prototype/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Lint
        run: npm run lint

  python:
    name: Python Tests & Lint (bodhi-supervisor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bodhi-supervisor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: bodhi-supervisor/requirements*.txt

      - name: Install dependencies
        # requirements.txt uses sys_platform markers so the Windows-only
        # packages (win10toast, pygetwindow) are skipped on this runner; the
        # code imports them behind try/except guards.
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Lint
        run: flake8 .
